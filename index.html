<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>啤酒陳列督導追蹤</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1d2330;color:#fff;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.box{text-align:center;padding:24px}
h1{font-size:22px;margin:0 0 6px}
p{opacity:.75;font-size:14px;margin:0 0 22px}
a{display:block;margin:10px auto;max-width:280px;padding:14px 18px;border-radius:12px;background:#0f5d4a;color:#fff;text-decoration:none;font-weight:700;font-size:16px}
a.m{background:#7048e8}
</style>
</head>
<body>
<div class="box">
  <h1>啤酒陳列督導追蹤</h1>
  <p id="tip">正在開啟…</p>
  <a href="display-audit.html">💻 網頁版</a>
  <a class="m" href="display-audit-m.html">📱 手機APP版</a>
</div>
<script>
// 手機自動開手機版、電腦自動開網頁版；網址加 ?pick 則停留在此頁手動選
if(!location.search.includes('pick')){
  const mobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||Math.min(screen.width,screen.height)<700;
  location.replace(mobile?'display-audit-m.html':'display-audit.html');
}else document.getElementById('tip').textContent='請選擇要開啟的版本';
</script>
</body>
</html>
